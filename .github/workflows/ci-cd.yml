name: CI/CD

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

# A newer push to the same branch or pull request cancels the run still in progress
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Lint, typecheck and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build

  docker:
    name: Build and smoke-test the Docker image
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: domaine-auris:ci
          # Shared with the publish job, which then reuses these layers
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Start container
        run: docker run --detach --name site --publish 3000:3000 domaine-auris:ci

      - name: Wait for the server
        run: |
          for attempt in $(seq 1 30); do
            if curl --silent --fail --output /dev/null http://localhost:3000/; then
              echo "Server is up"
              exit 0
            fi
            sleep 2
          done
          docker logs site
          exit 1

      - name: Check every page and image optimisation
        run: |
          for path in / /estate /visit /contact /wines/auris-reserve /wines/luna-verde \
            "/_next/image?url=%2Fimages%2Fwine1-clean.png&w=384&q=75"; do
            status=$(curl --silent --output /dev/null --write-out "%{http_code}" "http://localhost:3000$path")
            echo "$status $path"
            if [ "$status" != "200" ]; then
              docker logs site
              exit 1
            fi
          done

      - name: Stop container
        if: always()
        run: docker rm --force site

  publish:
    name: Publish image to GitHub Container Registry
    needs: docker
    # Pull requests are only checked; pushes to the main branch and version tags ship an image
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha
            type=semver,pattern={{version}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
